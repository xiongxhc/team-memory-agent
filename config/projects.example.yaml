# config/projects.example.yaml — copy to projects.yaml and fill with real repos.
# Maps forge repos (path_with_namespace) to canonical project slugs.
projects:
  project-alpha:
    projection: full             # optional; full is the default
    github_repos: [team/project-alpha]
    gitlab_repos: [team/project-alpha, team/alpha-tools]
    slack_channels: [C0123]
    feishu_channels: [oc_example_alpha]
    discord_channels: ["9876543210"]
  project-beta:
    projection: count-only
    github_repos: [team/project-beta]
areas:
  coordination:
    slack_channels: [C0456]
hidden_projects:
  - local-scratch
