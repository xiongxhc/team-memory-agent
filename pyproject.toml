[project]
name = "teammem"
version = "0.1.0"
description = "Local-first team activity ledger, member-bundle importer, and Markdown renderer"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{name = "Team Memory Agent contributors"}]
requires-python = ">=3.11"
keywords = ["agents", "knowledge-management", "local-first", "team-memory"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business",
]
dependencies = ["PyYAML>=6.0", "requests>=2.31"]

[project.urls]
Homepage = "https://github.com/xiongxhc/team-memory-agent"
Documentation = "https://github.com/xiongxhc/team-memory-agent#readme"
Issues = "https://github.com/xiongxhc/team-memory-agent/issues"
Repository = "https://github.com/xiongxhc/team-memory-agent"

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
teammem = "teammem.cli:main"

[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
markers = [
    "live: hits the real GitLab instance; runs only with TEAMMEM_RUN_LIVE=1",
]

[tool.setuptools.packages.find]
include = ["teammem*"]
