[project]
name = "teammem"
version = "0.1.0"
description = "Local-first team activity ledger, member-bundle importer, and Markdown renderer"
requires-python = ">=3.11"
dependencies = ["PyYAML>=6.0", "requests>=2.31"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
teammem = "teammem.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
markers = [
    "live: hits the real GitLab instance; runs only with TEAMMEM_RUN_LIVE=1",
]

[tool.setuptools.packages.find]
include = ["teammem*"]
