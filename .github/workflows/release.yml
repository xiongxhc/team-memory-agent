name: release

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: pypi-release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Validate release tag and package versions
        run: |
          python - <<'PY'
          import os
          import tomllib
          from pathlib import Path

          hub = tomllib.loads(Path("pyproject.toml").read_text())["project"]["version"]
          memberkit = tomllib.loads(
              Path("packages/memberkit/pyproject.toml").read_text()
          )["project"]["version"]
          tag = os.environ["GITHUB_REF_NAME"]
          assert hub == memberkit, f"package versions differ: {hub} != {memberkit}"
          assert tag == f"v{hub}", f"release tag {tag} does not match v{hub}"
          PY
      - name: Build distributions
        run: |
          python -m pip install --upgrade build twine
          python -m build --outdir dist/teammem .
          python -m build --outdir dist/memberkit packages/memberkit
          python -m twine check dist/teammem/* dist/memberkit/*
      - uses: actions/upload-artifact@v7
        with:
          name: teammem-distributions
          path: dist/teammem/
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        with:
          name: memberkit-distributions
          path: dist/memberkit/
          if-no-files-found: error

  publish-teammem:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: teammem-distributions
          path: dist/
      - name: Publish teammem to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  publish-memberkit:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi-memberkit
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: memberkit-distributions
          path: dist/
      - name: Publish teammem-memberkit to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
